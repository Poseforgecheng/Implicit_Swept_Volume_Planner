# Three-level real-robot profile loaded after planner.yaml.
# Geometry, mesh, topic names and conservative speed limits remain inherited
# from planner.yaml; this file only enables the paper's current planning loop.

# Match the formal three-level backend initialization while retaining the
# deployment profile's lower reference speeds.
inittime: 0.25

se2:
  # Smooth the discretized topology chain before LOW/MEDIUM/HIGH assignment.
  # Every accepted displacement is checked with the oriented footprint and
  # both adjacent tangent connections, so smoothing cannot cut through a wall.
  corner_smoothing_iterations: 5
  corner_smoothing_alpha: 0.50

risk:
  enable_three_level: true
  low_threshold: 0.55
  high_threshold: 0.85
  hysteresis: 0.05
  # Keep at least three samples around a HIGH interval so the MEDIUM bridge is
  # not immediately removed by undersupported-segment coalescing.
  guard_states: 2
  clearance_scale: 0.20
  correction_distance_scale: 0.30
  localization_sigma: 0.02
  localization_sigma_scale: 3.0
  control_error: 0.03
  map_error: 0.02
  shape_error: 0.01
  weight_clearance: 0.90
  weight_orientation_width: 0.70
  weight_orientation_continuity: 0.80
  weight_correction: 0.60
  weight_uncertainty: 0.75

full_svsdf:
  max_iterations: 600
  max_evaluations: 1800
  timeout_sec: 1.5
  verbose: -1

optimizer:
  # Retain the rounded support chain during polynomial fitting. A one-metre
  # chord can visually cut an Ackermann corner even after state smoothing.
  fit_max_piece_length_r2: 0.30
  fit_max_piece_length_se2: 0.30
  fit_max_heading_change: 0.10
  coalesce_escalated_equal_level_segments: true
  # Ackermann execution benefits from a slightly stronger shared tangent at
  # LOW/MEDIUM/HIGH solver boundaries.  The full validation gate still checks
  # the resulting geometry and dynamics before publication.
  stitch_tangent_speed_scale: 0.70
  stitch_max_tangent_speed_ratio: 0.85
  stitch_guard_pieces: 0
  post_stitch_smoothing_iterations: 12
  post_stitch_smoothing_alpha: 0.45
  post_stitch_sample_spacing: 0.12

anytime:
  # Eight seconds bounds a single interactive planning request. The planner
  # returns the first validated incumbent and does not spend the remaining
  # budget on publication-irrelevant tail quality improvement.
  total_time_budget_sec: 8.0
  continue_after_first_solution: false
  refine_after_first_solution: false
  post_incumbent_svsdf_budget: 4
  tail_refinement_svsdf_budget: 1

validation:
  min_clearance: 0.0
  time_step_sec: 0.01
  max_translation_step_m: 0.01
  max_yaw_step_rad: 0.01
  footprint_boundary_step_m: 0.01
  footprint_interior_step_m: 0.02
  collision_clearance_m: 0.0
  max_subdivision_depth: 24
  velocity_tolerance: 0.001
  acceleration_tolerance: 0.01
  yaw_rate_tolerance: 0.001
  max_yaw_acceleration: 6.0
  yaw_acceleration_tolerance: 0.01
  position_jump_tolerance: 0.0001
  velocity_jump_tolerance: 0.001
  acceleration_jump_tolerance: 0.01
  yaw_jump_tolerance: 0.001
  yaw_rate_jump_tolerance: 0.01

hybrid_astar:
  step_size: 0.20
  wheel_base: 0.5
  max_steer: 0.6
  steer_samples: 5
  goal_tolerance_pos: 0.35
  goal_tolerance_yaw: 0.4
  reverse_penalty: 2.0
  steer_penalty: 0.2
  steer_change_penalty: 0.2
  switch_penalty: 2.0
  max_expansions: 50000
  fast_pass_max_expansions: 8000
  fast_pass_steer_samples: 3
  heuristic_weight: 1.0
  pose_recovery_max_radius: 0.6
  pose_recovery_radial_step: 0.05
  pose_recovery_angular_samples: 24
